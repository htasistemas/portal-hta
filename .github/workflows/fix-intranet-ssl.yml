name: Fix intranet SSL default

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Configure intranet default certificate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TORRESOFT_SSH_HOST }}
          username: ${{ secrets.TORRESOFT_SSH_USERNAME }}
          password: ${{ secrets.TORRESOFT_SSH_PASSWORD }}
          script: |
            set -eu

            domain="intranet.torresoftbrasil.com.br"
            cert_dir="/etc/letsencrypt/live/${domain}"
            conf="/etc/nginx/conf.d/00-intranet-default-ssl.conf"

            if [ ! -s "${cert_dir}/fullchain.pem" ] || [ ! -s "${cert_dir}/privkey.pem" ]; then
              echo "Certificate files not found in ${cert_dir}" >&2
              ls -la /etc/letsencrypt/live >&2 || true
              exit 1
            fi

            nginx -T > "/root/nginx-before-intranet-default-ssl-$(date +%Y%m%d%H%M%S).conf" 2>&1 || true

            cat > "${conf}" <<EOF
            server {
                listen 443 ssl http2 default_server;
                listen [::]:443 ssl http2 default_server;
                server_name _;

                ssl_certificate ${cert_dir}/fullchain.pem;
                ssl_certificate_key ${cert_dir}/privkey.pem;

                add_header Strict-Transport-Security "max-age=31536000" always;
                return 301 https://${domain}\$request_uri;
            }
            EOF

            if ! nginx -t; then
              rm -f "${conf}"
              nginx -t
              exit 1
            fi

            systemctl reload nginx
            nginx -T 2>&1 | grep -n "00-intranet-default-ssl.conf\|default_server\|ssl_certificate"
